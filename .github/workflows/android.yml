name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APKs (all ABIs)
        run: ./gradlew :app:assembleGenericDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload debug APKs
        uses: actions/upload-artifact@v5
        with:
          name: duck-debug-apk
          path: artifacts/*.apk
          if-no-files-found: error

  release:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Optional signing. Configure these repository secrets to get a signed release:
      #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # Without them the release APK is still built, just unsigned.
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/duck-release.jks"

      - name: Build release APKs
        env:
          DUCK_KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/duck-release.jks', runner.temp) || '' }}
          DUCK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DUCK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DUCK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleGenericRelease -PnoSplits --stacktrace

      - name: Collect release APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload release APKs
        uses: actions/upload-artifact@v5
        with:
          name: duck-release-apk
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
