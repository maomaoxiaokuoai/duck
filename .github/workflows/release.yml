name: Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Default to read-only; the release job opts into contents: write explicitly.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all ABIs
    runs-on: ubuntu-latest

    # Signing secrets are only exposed to trusted refs. A pull_request from a fork can
    # modify build scripts, so it must never receive the keystore: PR runs build unsigned
    # APKs purely as a compile check.
    env:
      KEYSTORE_BASE64: ${{ (github.event_name != 'pull_request' && secrets.KEYSTORE_BASE64) || '' }}
      KEYSTORE_PASSWORD: ${{ (github.event_name != 'pull_request' && secrets.KEYSTORE_PASSWORD) || '' }}
      KEY_ALIAS: ${{ (github.event_name != 'pull_request' && secrets.KEY_ALIAS) || '' }}
      KEY_PASSWORD: ${{ (github.event_name != 'pull_request' && secrets.KEY_PASSWORD) || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Bump before building, so the APK carries the version it is published as.
      - name: Bump version
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: bump
        run: |
          python3 - <<'PYEOF'
          import re
          src = open('app/build.gradle.kts', encoding='utf-8').read()
          name = re.search(r'versionName\s*=\s*"([^"]+)"', src).group(1)
          code = int(re.search(r'versionCode\s*=\s*(\d+)', src).group(1))
          parts = name.split('.')
          parts[-1] = str(int(parts[-1]) + 1)
          new_name = '.'.join(parts)

          src = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "' + new_name + '"', src)
          src = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = ' + str(code + 1), src)
          open('app/build.gradle.kts', 'w', encoding='utf-8').write(src)

          text = open('CHANGELOG.md', encoding='utf-8').read()
          entry = '## v' + new_name + ' — 自动发布' + chr(10)*2 + '本次更新为自动构建，详见提交记录。' + chr(10)*2
          open('CHANGELOG.md', 'w', encoding='utf-8').write(entry + text)

          print(new_name)
          PYEOF
          VERSION=$(grep -oP "versionName = \K[^\"]+" app/build.gradle.kts | tail -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "升到 $VERSION"

      # Commit the bump so the tag points at it. [skip ci] stops this push from
      # starting another build, which would bump again forever.
      - name: Commit the version bump
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts CHANGELOG.md
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git tag -a "v${{ steps.bump.outputs.version }}" -m "duck ${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          # The tag is created below by the release action, not pushed here.
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Prepare signing material
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/duck-release.jks"
          {
            echo "DUCK_KEYSTORE_PATH=$RUNNER_TEMP/duck-release.jks"
            echo "DUCK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "DUCK_KEY_ALIAS=$KEY_ALIAS"
            echo "DUCK_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "signing: enabled"

      # No -PnoSplits: build one APK per ABI plus a universal one.
      - name: Build release APKs (all ABIs)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          for f in artifacts/*.apk; do
            size=$(du -h "$f" | cut -f1)
            echo "- `$(basename "$f")` — $size" >> "$GITHUB_STEP_SUMMARY"
          done
          ls -lh artifacts

      - name: Verify signatures
        if: env.KEYSTORE_BASE64 != ''
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ok=0; bad=0
          for f in artifacts/*.apk; do
            if "$BT/apksigner" verify "$f" 2>/dev/null; then
              echo "signed:   $(basename "$f")"; ok=$((ok+1))
            else
              echo "UNSIGNED: $(basename "$f")"; bad=$((bad+1))
            fi
          done
          echo "signed=$ok unsigned=$bad" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bad" -gt 0 ]; then
            echo "::error::$bad APK(s) are not signed and cannot be installed"
            exit 1
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: duck-apk
          path: artifacts/*.apk
          if-no-files-found: error

      # Publish from this same run. Pushing a tag would start a second workflow that
      # has to rebuild from scratch; everything needed is already here.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          body: |
            本次更新为自动构建。

            提交记录见 ${{ github.server_url }}/${{ github.repository }}/commits/main
          files: artifacts/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
