name: Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Default to read-only; the release job opts into contents: write explicitly.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all ABIs
    runs-on: ubuntu-latest

    # Signing secrets are only exposed to trusted refs. A pull_request from a fork can
    # modify build scripts, so it must never receive the keystore: PR runs build unsigned
    # APKs purely as a compile check.
    env:
      KEYSTORE_BASE64: ${{ (github.event_name != 'pull_request' && secrets.KEYSTORE_BASE64) || '' }}
      KEYSTORE_PASSWORD: ${{ (github.event_name != 'pull_request' && secrets.KEYSTORE_PASSWORD) || '' }}
      KEY_ALIAS: ${{ (github.event_name != 'pull_request' && secrets.KEY_ALIAS) || '' }}
      KEY_PASSWORD: ${{ (github.event_name != 'pull_request' && secrets.KEY_PASSWORD) || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Prepare signing material
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/duck-release.jks"
          {
            echo "DUCK_KEYSTORE_PATH=$RUNNER_TEMP/duck-release.jks"
            echo "DUCK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "DUCK_KEY_ALIAS=$KEY_ALIAS"
            echo "DUCK_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "signing: enabled"

      # No -PnoSplits: build one APK per ABI plus a universal one.
      - name: Build release APKs (all ABIs)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          for f in artifacts/*.apk; do
            size=$(du -h "$f" | cut -f1)
            echo "- `$(basename "$f")` — $size" >> "$GITHUB_STEP_SUMMARY"
          done
          ls -lh artifacts

      - name: Verify signatures
        if: env.KEYSTORE_BASE64 != ''
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ok=0; bad=0
          for f in artifacts/*.apk; do
            if "$BT/apksigner" verify "$f" 2>/dev/null; then
              echo "signed:   $(basename "$f")"; ok=$((ok+1))
            else
              echo "UNSIGNED: $(basename "$f")"; bad=$((bad+1))
            fi
          done
          echo "signed=$ok unsigned=$bad" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bad" -gt 0 ]; then
            echo "::error::$bad APK(s) are not signed and cannot be installed"
            exit 1
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: duck-apk-${{ github.ref_name }}
          path: artifacts/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download APKs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: duck-apk-${{ github.ref_name }}
          path: artifacts

      # Turn the matching CHANGELOG section into the release body.
      - name: Extract changelog for this tag
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          python3 - "$VER" <<'PYEOF' > notes.md
          import re, sys
          ver = sys.argv[1]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          # grab "## [1.2.3] ... " up to the next "## ["
          # Accept both "## [2.0.39]" and "## v2.0.39" headings.
          pat = re.compile(r'^## (?:\[|v?)' + re.escape(ver) + r'\]?.*?$(.*?)(?=^## (?:\[|v?\d)|\Z)', re.S | re.M)
          m = pat.search(text)
          if m:
              body = m.group(1).strip()
              print(body if body else '_该版本无详细说明_')
          else:
              print('_未在 CHANGELOG.md 中找到 %s 的说明_' % ver)
          PYEOF
          {
            echo "## 变更内容"
            echo
            cat notes.md
            echo
          } > body.md
          cat body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*.apk
          body_path: body.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
